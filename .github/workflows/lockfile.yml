name: lockfile

on:
  pull_request:
  push:

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: python -m pip install --require-hashes -r .github/requirements-uv.txt
      - name: Check the lock, hashes, and exports
        run: |
          uv lock --check
          python scripts/check_lock.py
          uv export --frozen --no-emit-project --emit-find-links -o requirements.txt
          git diff --exit-code -- requirements.txt
          uv export --frozen --only-group download --no-emit-project --emit-find-links -o requirements-download.txt
          git diff --exit-code -- requirements-download.txt
